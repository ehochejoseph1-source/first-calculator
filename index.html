<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <h1>Simple Calculator</h1>

        <div class="display" id="display" role="status" aria-live="polite">0</div>

        <div class="buttons">
            <button class="clear"  data-action="clear">Clear</button>
            <button class="operator" id="divideBtn" data-operator="/" aria-label="Divide">÷</button>

            <button  data-number="7" class="number">7</button>
            <button  data-number="8" class="number">8</button>
            <button  data-number="9" class="number">9</button>
            <button class="operator" id="multiplyBtn" data-operator="*" aria-label="Multiply">×</button>

            <button  data-number="4" class="number">4</button>
            <button  data-number="5" class="number">5</button>
            <button  data-number="6" class="number">6</button>
            <button class="operator" id="subtractBtn" data-operator="-" aria-label="Subtract">−</button>

            <button  data-number="1" class="number">1</button>
            <button  data-number="2" class="number">2</button>
            <button  data-number="3" class="number">3</button>
            <button class="operator" id="addBtn" data-operator="+" aria-label="Add">+</button>

            <button class="zero"  data-number="0" class="number">0</button>
            <button  data-action="decimal">.</button>
            <button class="equals" id="equals" data-action="equals">=</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
